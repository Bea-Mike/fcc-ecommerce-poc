apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: default
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pod Security Context: non-root user "node"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: beatricebalzarini/fcc-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          
          # Container Security Hardening
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Direct mapping of environment variables from ConfigMap & Secret
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret

          # CPU/RAM limits for HPA autoscaling
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Health Probes pointing to /health on port 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5